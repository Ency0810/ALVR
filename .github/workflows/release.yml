name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v21.0.0-dev14-linuxfix1)"
        required: true
        type: string
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Check for existing release
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists, skipping build."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "No release for $TAG yet, proceeding."
          fi

  build-linux:
    name: Linux streamer + launcher
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config nasm \
            libva-dev libdrm-dev libvulkan-dev libx264-dev \
            libasound2-dev libxrandr-dev libunwind-dev libgtk-3-dev \
            libpipewire-0.3-dev libspa-0.2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Package streamer and launcher
        env:
          RUST_BACKTRACE: 1
        run: |
          set -e
          cargo xtask package-streamer --gpl --ci
          cargo xtask package-launcher --ci

      - name: Collect assets
        run: |
          set -e
          mkdir -p artifacts
          cp build/alvr_streamer_linux.tar.gz artifacts/
          cp build/alvr_launcher_linux.tar.gz artifacts/
          ls -lh artifacts/

      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: artifacts/*
          if-no-files-found: error

  build-android:
    name: Quest client APK
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-32 build-tools;34.0.0"

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Package client
        env:
          RUST_BACKTRACE: 1
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo xtask package-client --ci

      - name: Align and sign (debug keystore)
        run: |
          set -e
          mkdir -p artifacts
          BT="$ANDROID_HOME/build-tools/34.0.0"
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          "$BT/zipalign" -f 4 \
            build/alvr_client_android/alvr_client_android.apk \
            artifacts/alvr_client_android_unsigned.apk
          "$BT/apksigner" sign \
            --ks debug.keystore --ks-pass pass:android --key-pass pass:android \
            --out artifacts/alvr_client_android.apk \
            artifacts/alvr_client_android_unsigned.apk
          rm artifacts/alvr_client_android_unsigned.apk
          rm -f artifacts/*.idsig
          ls -lh artifacts/

      - uses: actions/upload-artifact@v7
        with:
          name: android-client
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [guard, build-linux, build-android]
    if: needs.guard.outputs.proceed == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Read ALVR version
        id: meta
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ALVR version: $version"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: artifacts/**
          body: |
            Linux / Quest build of [`alvr-linux-fix`](https://github.com/Ency0810/alvr-linux-fix/tree/linux-fix).

            ALVR version: `${{ steps.meta.outputs.version }}`
            Built from commit: `${{ github.sha }}`

            ### What's in this build

            - PR #3425 — Linux direct mode / texture / frame sync fixes
            - `nv-codec-headers` pinned to `13.0.19.0`

            ### Assets

            | File | Description |
            | --- | --- |
            | `alvr_streamer_linux.tar.gz` | Linux streamer + dashboard (`bin/alvr_dashboard`) |
            | `alvr_launcher_linux.tar.gz` | Linux launcher GUI |
            | `alvr_client_android.apk` | Quest client, debug-signed |
            | `SHA256SUMS.txt` | Checksums |

            ### Requirements

            - NVIDIA driver **570+** (required by the pinned `nv-codec-headers`)
            - SteamVR, PipeWire, Vulkan, libva
            - For AMD/Intel GPUs use the [official ALVR](https://github.com/alvr-org/ALVR/releases) instead

            ### Install

            ```bash
            tar -xzf alvr_streamer_linux.tar.gz
            ./alvr_streamer_linux/bin/alvr_dashboard
            ```

            ### Important: streamer and client must match

            ALVR checks protocol compatibility using the version string
            (`${{ steps.meta.outputs.version }}`). The official `v20.14.1` client
            **will not connect** to this streamer, and this APK will not connect
            to an official streamer. Install both APK and streamer from the same
            release, and update them together.

            This APK is signed with a debug key, so uninstalling the previous
            client (including the official one) is required before installing.
